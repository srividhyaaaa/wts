```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Student Study Planner</h1>
        <p>Organize your studies and stay productive</p>
    </header>

    <main>
        <section class="card">
            <h2>Add Study Task</h2>

            <input type="text" id="subject" placeholder="Enter subject">
            <input type="text" id="task" placeholder="Enter task">
            <input type="number" id="hours" placeholder="Study hours">

            <button onclick="addTask()">Add Task</button>
        </section>

        <section class="card">
            <h2>Today's Tasks</h2>
            <div id="taskList">
                <p class="empty">No tasks added yet.</p>
            </div>
        </section>

        <section class="stats">
            <div>
                <h3 id="total">0</h3>
                <p>Total Tasks</p>
            </div>

            <div>
                <h3 id="completed">0</h3>
                <p>Completed</p>
            </div>

            <div>
                <h3 id="hoursTotal">0</h3>
                <p>Study Hours</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Student Study Planner</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
```
